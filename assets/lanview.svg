<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Abgerundeter App-Hintergrund (Squircle) -->
  <rect x="12" y="12" width="232" height="232" rx="52" ry="52" fill="url(#bgGrad)" stroke="#334155" stroke-width="5"/>

  <!-- Hinterer zweiter Monitor (Multi-Monitor-Symbolik) -->
  <rect x="64" y="42" width="144" height="92" rx="12" ry="12" fill="#0f172a" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.55"/>

  <!-- Vorderer Hauptmonitor -->
  <rect x="38" y="64" width="156" height="104" rx="14" ry="14" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="5"/>

  <!-- Monitor-Innenfläche / Terminal- & Screen-Sharing-Grid -->
  <rect x="48" y="74" width="136" height="84" rx="8" ry="8" fill="#09101f" fill-opacity="0.72"/>

  <!-- LAN / SSH-Verbindungswellen links oben im Screen -->
  <circle cx="74" cy="116" r="8" fill="#38bdf8"/>
  <path d="M 90 100 A 22 22 0 0 1 90 132" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 103 90 A 36 36 0 0 1 103 142" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Monitor-Standfuß -->
  <path d="M 102 168 L 94 196 L 138 196 L 130 168 Z" fill="#475569"/>
  <rect x="78" y="194" width="76" height="9" rx="4.5" fill="#94a3b8"/>

  <!-- Remote-Mauszeiger (Amber/Gold Highlight rechts unten) -->
  <path d="M 142 114 L 142 184 L 161 167 L 176 198 L 191 191 L 176 160 L 201 160 Z"
        fill="url(#amberGrad)" stroke="#0f172a" stroke-width="6" stroke-linejoin="round"/>
</svg>
